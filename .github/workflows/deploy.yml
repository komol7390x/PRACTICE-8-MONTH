name: Deploy Backend Staging

on:
  push:
    branches:
      - staging

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install and Build
        run: |
          npm install
          npm run build
          zip -r deploy.zip dist package.json package-lock.json

      - name: Copy zip to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "deploy.zip"
          target: "/root/Komol/beckend/PRACTICE-8-MONTH"

      - name: Finalize Deployment on Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # 1. Root muhitini sozlash
            export PM2_HOME=/root/.pm2
            cd /root/Komol/beckend/PRACTICE-8-MONTH
            
            # 2. Eskisini o'chirib, yangisini ochish
            rm -rf dist
            unzip -o deploy.zip
            
            # 3. Kutubxonalarni o'rnatish
            npm install --production
            
            # 4. PM2 ni boshqarish
            # Eski jarayonni o'chiramiz
            pm2 delete backend-staging || true
            
            # 5. SIZNING FAYLINGIZ: dist/src/main.js
            # Aniq yo'l bilan ishga tushiramiz
            pm2 start dist/src/main.js --name "backend-staging"
            
            # 6. Saqlash va tozalash
            pm2 save
            rm -f deploy.zip
            echo "✅ Backend (dist/src/main.js) muvaffaqiyatli ishga tushdi!"