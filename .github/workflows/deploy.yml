name: Deploy Backend Staging

on:
  push:
    branches:
      - staging

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build and Zip
        run: |
          npm install
          # Build qilish
          npm run build
          # Tekshirish: dist papkasi bormi?
          ls -la dist/
          # Zip ichiga dist papkasini to'liq solish
          zip -r deploy.zip dist package.json package-lock.json

      - name: Copy zip to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "deploy.zip"
          target: "/root/Komol/beckend/PRACTICE-8-MONTH"

      - name: Finalize Deployment on Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Xatolik bo'lsa darhol to'xtatish
            set -e
            
            cd /root/Komol/beckend/PRACTICE-8-MONTH
            
            # 1. Git pull (serverdagi kodni yangilash)
            git pull origin staging || echo "Git pull amalga oshmadi, davom etamiz..."
            
            # 2. Arxivni ochish va eski distni tozalash
            rm -rf dist
            unzip -o deploy.zip
            
            # 3. Kutubxonalarni o'rnatish
            npm install --production
            
            # 4. PM2 ni boshqarish
            # Avval o'chirib ko'ramiz, xato bersa ham davom etamiz (|| true)
            pm2 delete backend-staging || true
            
            # Yangi start (To'liq yo'l bilan)
            pm2 start dist/main.js --name "backend-staging"
            
            # 5. Saqlash va tozalash
            pm2 save
            rm -f deploy.zip
            
            echo "✅ Backend muvaffaqiyatli yangilandi!"