name: Deploy Backend Staging

on:
  push:
    branches:
      - staging

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build and Zip
        run: |
          # 1. Kutubxonalarni o'rnatish va build qilish
          npm install
          npm run build
          # 2. Faqat dist va package fayllarni zip qilish
          zip -r deploy.zip dist package.json package-lock.json

      - name: Copy zip to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "deploy.zip"
          target: "~/Komol/beckend/PRACTICE-8-MONTH"

      - name: Finalize Deployment on Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/Komol/beckend/PRACTICE-8-MONTH
            
            # 1. Git orqali o'zgarishlarni pull qilish (serverdagi kod yangilanishi uchun)
            git pull origin staging
            
            # 2. Kelgan zip arxivni ochish (dist papkasini yangilaydi)
            unzip -o deploy.zip
            
            # 3. Yangi kutubxonalarni o'rnatish (faqat production)
            npm install --production
            
            # 4. PM2 ni yangilash (Eskisini o'chirib yangisini ishga tushirish)
            # Bu usul Telegram Bot conflict xatosini oldini oladi
            pm2 delete backend-staging || true
            pm2 start dist/main.js --name "backend-staging"
            
            # 5. Holatni saqlash va vaqtincha faylni o'chirish
            pm2 save
            rm -f deploy.zip
            
            echo "✅ Deploy muvaffaqiyatli yakunlandi!"