name: Deploy Backend Staging

on:
  push:
    branches:
      - staging

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install and Build
        run: |
          npm install
          npm run build
          # Faqat kerakli fayllarni zip qilamiz
          zip -r deploy.zip dist package.json package-lock.json

      - name: Copy zip to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "deploy.zip"
          target: "~/Komol/beckend/PRACTICE-8-MONTH"

      - name: Extract and Restart PM2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/Komol/beckend/PRACTICE-8-MONTH
            
            # 1. Arxivni ochish (eskisini ustidan yozadi)
            unzip -o deploy.zip
            
            # 2. Faqat kerakli kutubxonalarni o'rnatish
            npm install --production
            
            # 3. Nomi bo'yicha restart qilish (backend-staging)
            # Agar jarayon yo'q bo'lsa, yangi yaratadi
            pm2 restart backend-staging --update-env || pm2 start dist/main.js --name "backend-staging"
            
            # 4. Tozalash va saqlash
            rm -f deploy.zip
            pm2 save