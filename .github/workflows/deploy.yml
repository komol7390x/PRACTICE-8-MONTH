name: Deploy Backend Staging

on:
  push:
    branches:
      - staging

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build and Zip
        run: |
          npm install
          npm run build
          # Zip qilishdan oldin fayllar borligini tekshiramiz
          if [ ! -d "dist" ]; then echo "Build failed: dist folder not found"; exit 1; fi
          # Zip ichiga dist papkasi va package fayllarni solamiz
          zip -r deploy.zip dist package.json package-lock.json

      - name: Copy zip to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "deploy.zip"
          target: "/root/Komol/beckend/PRACTICE-8-MONTH"

      - name: Finalize Deployment on Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /root/Komol/beckend/PRACTICE-8-MONTH
            
            # 1. Serverdagi Gitni yangilash
            git pull origin staging || echo "Git pull failed, skipping..."
            
            # 2. Eskisini tozalash va yangisini ochish
            rm -rf dist
            unzip -o deploy.zip
            
            # 3. Fayllar tushganini tekshirish (Logda ko'rinadi)
            ls -la dist/
            
            # 4. Kutubxonalarni o'rnatish
            npm install --production
            
            # 5. PM2 ni boshqarish
            # Agar backend-staging nomi bilan topilmasa xato bermasligi uchun || true
            pm2 delete backend-staging || true
            
            # Aniq yo'l (Absolute path) bilan ishga tushirish
            pm2 start /root/Komol/beckend/PRACTICE-8-MONTH/dist/main.js --name "backend-staging"
            
            # 6. Tozalash
            pm2 save
            rm -f deploy.zip
            echo "🚀 Backend successfully deployed!"