name: Deploy Backend Staging

on:
  push:
    branches:
      - staging

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install and Build
        run: |
          npm install
          npm run build
          zip -r deploy.zip dist package.json package-lock.json

      - name: Copy zip to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "deploy.zip"
          target: "/root/course/backend/PRACTICE-8-MONTH"

      - name: Finalize Deployment on Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # PM2 yo'lini aniqlash
            export PM2_HOME=/root/.pm2
            
            # 1. Papkaga kirish (agar papka bo'lmasa xato berib to'xtaydi)
            cd /root/course/backend/PRACTICE-8-MONTH || { echo "Papka topilmadi"; exit 1; }
            
            # 2. Git orqali kodni yangilash
            git fetch origin staging
            git checkout staging
            git pull origin staging
            
            # 3. Zip faylni yoyish (unzip o'rnatilgan bo'lishi shart)
            if [ -f "deploy.zip" ]; then
                rm -rf dist
                unzip -o deploy.zip
                rm -f deploy.zip
            else
                echo "deploy.zip topilmadi, build jarayonini tekshiring!"
            fi
            
            # 4. Kutubxonalarni o'rnatish
            npm install --omit=dev
            
            # 5. PM2: Agar jarayon bo'lsa restart, bo'lmasa start
            # --update-env yangi o'zgaruvchilarni qabul qilish uchun kerak
            pm2 describe backend-staging > /dev/null
            if [ $? -eq 0 ]; then
              echo "Restarting backend-staging..."
              pm2 restart backend-staging --update-env
            else
              echo "Starting new process backend-staging..."
              pm2 start dist/src/main.js --name "backend-staging"
            fi
            
            # 6. Holatni saqlash
            pm2 save
            echo "✅ Backend muvaffaqiyatli yangilandi va ishga tushdi!"