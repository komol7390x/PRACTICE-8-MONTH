services:
  db:
    image: postgres:16-alpine
    container_name: practice_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-practice}
      POSTGRES_USER: ${DB_USER:-practice}
      POSTGRES_PASSWORD: ${DB_PASS:-practice}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: practice_api
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env
    environment:
      PORT: ${PORT:-3000}
      NODE_ENV: ${NODE_ENV:-development}

      APP_VERSION: ${APP_VERSION:-v1}
      SWAGGER_PASSWORD: ${SWAGGER_PASSWORD:-admin}

      TOKEN_ACCESS_TOKEN_KEY: ${TOKEN_ACCESS_TOKEN_KEY:-change_me}
      TOKEN_ACCESS_TOKEN_TIME: ${TOKEN_ACCESS_TOKEN_TIME:-3600}

      SUPER_ADMIN_USERNAME: ${SUPER_ADMIN_USERNAME:-admin}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-admin}
      SUPER_ADMIN_FULLNAME: ${SUPER_ADMIN_FULLNAME:-Admin}

      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-practice}
      DB_USER: ${DB_USER:-practice}
      DB_PASS: ${DB_PASS:-practice}

      FRONT_URL_SERVER: ${FRONT_URL_SERVER:-http://localhost:5173}
      FRONT_URL_LOCAL: ${FRONT_URL_LOCAL:-http://localhost:5173}
      BECKEND_URL_SERVER: ${BECKEND_URL_SERVER:-http://localhost:${PORT:-3000}}
      BECKEND_URL_LOCAL: ${BECKEND_URL_LOCAL:-http://localhost:${PORT:-3000}}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
      JWT_SECRET: ${JWT_SECRET:-change_me}

      UPLOAD_FOLDER: ${UPLOAD_FOLDER:-uploads}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./uploads:/app/uploads

volumes:
  db_data:
